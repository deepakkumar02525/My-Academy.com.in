<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Current Affairs</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      box-sizing: border-box;
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f5f7ff, #e9f2ff);
      display: flex;
      justify-content: top;
      align-items: top;
      min-height: 100vh;
      padding: 30px;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
      padding: 40px 30px 50px;
      text-align: center;
    }

    h1 {
      font-size: clamp(2rem, 3vw, 3rem);
      color: #1d3557;
      margin-bottom: 30px;
      letter-spacing: 1px;
    }

    .month-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 18px;
      margin-top: 20px;
    }

    .month-btn {
      display: inline-block;
      text-decoration: none;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: #fff;
      padding: 18px 12px;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 8px 18px rgba(37, 99, 235, 0.25);
    }

    .month-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 22px rgba(37, 99, 235, 0.35);
    }

    .month-btn:nth-child(even) {
      background: linear-gradient(135deg, #0f766e, #14b8a6);
      box-shadow: 0 8px 18px rgba(20, 184, 166, 0.25);
    }

    .month-btn:nth-child(3n) {
      background: linear-gradient(135deg, #7c3aed, #a78bfa);
      box-shadow: 0 8px 18px rgba(124, 58, 237, 0.25);
    }
  </style>
</head>
