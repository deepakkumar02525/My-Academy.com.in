
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
  <title>करेंट अफेयर्स</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@400;600;700;800&display=swap');

    :root{
      --bg:#dfe9fb;
      --card:#ffffff;
      --text:#222;
      --muted:#6b7280;
      --accent:#2563eb;
      --ok:#16a34a;
      --bad:#dc2626;
      --border:#e5e7eb;
      --radius:14px;
      --space:14px;

      /* Base font sizes (mobile-first) */
      --fs-body:19px;
      --fs-label:19px;
      --fs-h1:27px;
      --fs-brand:31px; /* ~2pt (≈2.66px) बड़ा than h1 */
      --fs-btn:19px;
    }
    @media (min-width:480px){
      :root{
        --fs-body:19px;
        --fs-label:20px;
        --fs-h1:29px;
        --fs-brand:33px;
        --fs-btn:19px;
      }
    }
    @media (min-width:768px){
      :root{
        --fs-body:19px;
        --fs-label:21px;
        --fs-h1:31px;
        --fs-brand:35px;
        --fs-btn:19px;
      }
    }

    *{box-sizing:border-box}
    html {
      height: 100%;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    html::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;
    }
    body{
      margin:0;
      padding:8px 14px 24px;
      min-height:100vh;
      font-family:"Noto Serif Devanagari","Sanskrit Text","Noto Sans Devanagari","Nirmala UI",Mangal,serif;
      background:var(--bg);
      color:var(--text);
      line-height:1.5;
      font-size:var(--fs-body);
      box-sizing:border-box;
      overflow-x:hidden;
      overflow-y:auto;
      scrollbar-width:none;
      -ms-overflow-style:none;
      -webkit-text-size-adjust:100%;
      text-rendering:optimizeLegibility;
    }
    body::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;
    }
    .site-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      max-width:980px;
      margin:0 auto;
      position:relative;
    }
    .brand{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      font-weight:800;
      color:#ef4444; /* red */
      font-size:var(--fs-brand);
      letter-spacing:.2px;
    }
    .social-links{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:8px;
      margin-left:auto;
    }
    .social-link{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:38px;
      height:38px;
      border-radius:50%;
      color:#fff;
      text-decoration:none;
      transition:transform .15s ease, box-shadow .15s ease;
    }
    .social-link:hover{
      transform:translateY(-1px);
      box-shadow:0 5px 12px rgba(15,23,42,.2);
    }
    .social-link svg{
      width:21px;
      height:21px;
      fill:currentColor;
    }
    .youtube-link{ background:#ef4444; }
    .telegram-link{ background:#0ea5e9; }
    .whatsapp-link{ background:#22c55e; }
    .social-link:focus-visible{
      outline:3px solid rgba(37,99,235,.45);
      outline-offset:3px;
    }
    h1{
      text-align:center;
      font-size:var(--fs-h1);
      margin:12px 0 18px;
      color:#111827;
    }
    #quizTitle{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      margin:0;
      font-size:var(--fs-h1);
      line-height:1.2;
      white-space:nowrap;
    }

    .quiz-container{
      max-width:980px;
      margin:0 auto;
      display:grid;
      gap:6px;
    }
    .question{
      background:linear-gradient(135deg, #f8fbff 0%, #eef6ff 38%, #eaf1ff 100%);
      border:1px solid rgba(147, 197, 253, 0.65);
      border-radius:var(--radius);
      padding:16px;
      height:410px;
      overflow:hidden;
      box-shadow:0 6px 22px rgba(59, 130, 246, 0.12);
    }
    .question-meta{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin:0 0 10px;
      position:relative;
    }
    .meta-box{
      display:inline-flex;
      align-items:center;
      min-height:42px;
      padding:8px 14px;
      border-radius:10px;
      background:rgba(255,255,255,0.18);
      border:1px solid rgba(59, 130, 246, 0.25);
      color:#1f2937;
      font-weight:800;
      font-size:1.05rem;
      box-shadow:0 2px 10px rgba(59, 130, 246, 0.1);
      text-align:left;
      line-height:1.4;
    }
    #questionCounter{
      justify-content:flex-start;
      min-width:150px;
    }
    #questionTimer{
      justify-content:flex-end;
      min-width:120px;
      margin-left:auto;
    }
    .q-title{
      font-weight:800;
      font-size:1.25rem;
      line-height:1.7;
      white-space:pre-line;
      height:auto;
      overflow:hidden;
      margin:0 0 4px;
      color:#0f172a;
      text-shadow:none;
    }
    .q-title.compact{
      font-size:1.1rem;
      line-height:1.55;
    }
    .q-title.dense{
      font-size:1rem;
      line-height:1.45;
    }
    .options{
      display:flex;
      flex-direction:column;
      gap:10px; /* vertical spacing line by line */
    }

    /* Each option as a separate box */
    .options label.option{
      display:flex;
      align-items:center;
      gap:12px;
      padding:12px 14px;
      border:2px solid rgba(96, 165, 250, 0.5);
      border-radius:12px;
      background:linear-gradient(135deg, #ffffff 0%, #edf6ff 100%);
      cursor:pointer;
      transition:all .15s ease;
      font-size:var(--fs-label);
      user-select:none;
      color:#0f172a;
    }
    .options label.option:hover{
      border-color:#60a5fa;
      background:linear-gradient(135deg, #f8fbff 0%, #e0ecff 100%);
    }
    .option-text{
      flex:1;
      line-height:1.5;
      color:#0f172a;
      font-weight:700;
      text-shadow:none;
    }

    /* Bigger radio for mobile */
    .options input[type="radio"]{
      appearance:none;
      width:26px;
      height:26px;
      min-width:26px;
      min-height:26px;
      border:2px solid #9ca3af;
      border-radius:50%;
      display:inline-block;
      position:relative;
      outline:none;
      transition:border-color .15s ease, box-shadow .15s ease;
      background:#fff;
    }
    .options input[type="radio"]:checked{
      border-color:#60a5fa;
      box-shadow:0 0 0 3px rgba(96,165,250,0.12);
    }
    .options input[type="radio"]::after{
      content:"";
      position:absolute;
      inset:5px;
      border-radius:50%;
      background:transparent;
      transition:background .15s ease;
    }
    .options input[type="radio"]:checked::after{
      background:#60a5fa;
    }
    .options input[type="radio"]:checked ~ .option-text,
    .options label.option:has(input:checked) .option-text{
      color:#0f172a;
      text-shadow:none;
    }
    .options label.option:has(input:checked){
      background:linear-gradient(135deg, #ffffff 0%, #edf6ff 100%);
      border-color:#60a5fa;
      box-shadow:none;
    }

    /* Correct/Incorrect colors */
    .option.correct{
      background:#dcfce7 !important;
      border-color:var(--ok) !important;
    }
    .option.incorrect{
      background:#fee2e2 !important;
      border-color:var(--bad) !important;
    }
    .result-message{
      margin-top:12px;
      padding:10px 12px;
      border-radius:10px;
      background:rgba(255,255,255,0.8);
      border:1px solid rgba(148, 163, 184, 0.4);
      font-weight:800;
      line-height:1.5;
    }

    /* Buttons row (submit + restart) */
    .actions{
      position:sticky;
      bottom:0;
      left:0; right:0;
      background:rgba(247,247,251,.85);
      backdrop-filter: blur(6px);
      border-top:1px solid var(--border);
      padding:12px 10px;
      display:flex;
      gap:10px;
      justify-content:center;
      z-index:5;
    }
    .btn{
      border:0;
      border-radius:999px;
      padding:12px 18px;
      font-weight:700;
      font-size:var(--fs-btn);
      cursor:pointer;
      box-shadow:0 4px 14px rgba(0,0,0,.08);
      transition:transform .15s ease, box-shadow .15s ease;
    }
    .start-quiz-wrap{
      display:flex;
      justify-content:flex-start;
      align-items:center;
      margin:0;
    }
    .start-quiz-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:38px;
      min-width:116px;
      padding:8px 11px;
      border-radius:10px;
      background:linear-gradient(135deg, #2563eb, #7c3aed);
      color:#fff;
      font-size:.8rem;
      font-weight:800;
      line-height:1.2;
      box-shadow:0 8px 18px rgba(37, 99, 235, 0.2);
      margin-left:0;
    }
    .start-quiz-btn:disabled{
      opacity:0.75;
      cursor:not-allowed;
    }
    .btn:hover{
      transform:translateY(-1px);
      box-shadow:0 8px 18px rgba(0,0,0,.12);
    }
    .btn-submit{ background:#22c55e; color:#fff; }
    .btn-final-submit{ background:#7c3aed; color:#fff; }
    .btn-restart{ background:#ef4444; color:#fff; }
    #prevBtn,
    #nextBtn{
      min-width:150px;
      font-size:20px;
      padding:14px 22px;
      background:linear-gradient(135deg, #2563eb, #7c3aed);
      color:#fff;
      box-shadow:none;
      border:0;
      outline:none;
    }

    #prevBtn:hover,
    #nextBtn:hover{
      box-shadow:none;
    }

    /* Score modal */
    .modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.4);
      display:none;
      align-items:center;
      justify-content:center;
      padding:20px;
      z-index:50;
    }
    .modal .card{
      background:#fff;
      border-radius:18px;
      padding:24px;
      width:min(520px, 96vw);
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,.2);
    }
    .score{
      font-size:28px;
      font-weight:800;
      margin:8px 0 2px;
      color:#111827;
    }
    .note{
      font-size:16px;
      color:var(--muted);
      margin-bottom:14px;
    }
    .modal .btn{
      width:100%;
    }
    .sr-only{
      position:absolute!important;
      height:1px;width:1px;
      overflow:hidden;clip:rect(1px,1px,1px,1px);
      white-space:nowrap;border:0;padding:0;margin:-1px;
    }

    @media (max-width: 480px){
      body{
        padding:8px 10px 18px;
      }
      .site-header{
        gap:10px;
      }
      .brand{
        font-size:24px;
        line-height:1.3;
      }
      .social-links{
        gap:6px;
      }
      .social-link{
        width:34px;
        height:34px;
      }
      .social-link svg{
        width:18px;
        height:18px;
      }
      h1{
        font-size:24px;
        margin-bottom:12px;
      }
      .quiz-container{
        gap:4px;
      }
      .question{
        padding:12px;
        height:360px;
      }
      .question-meta{
        gap:8px;
        align-items:center;
        flex-wrap:wrap;
      }
      .meta-box{
        min-height:36px;
        padding:7px 10px;
        font-size:0.9rem;
      }
      #questionCounter{
        min-width:0;
      }
      #questionTimer{
        min-width:90px;
      }
      .start-quiz-btn{
        min-height:34px;
        min-width:104px;
        padding:7px 9px;
        font-size:.76rem;
      }
      .q-title{
        font-size:1.08rem;
        line-height:1.6;
        height:auto;
        margin-bottom:4px;
        word-break:break-word;
      }
      .q-title.dense{
        font-size:.92rem;
        line-height:1.4;
      }
      .options{
        gap:8px;
      }
      .options label.option{
        align-items:flex-start;
        gap:10px;
        padding:10px 12px;
      }
      .option-text{
        font-size:0.95rem;
        line-height:1.5;
        word-break:break-word;
      }
      .actions{
        padding:10px 8px 12px;
        gap:8px;
      }
      .btn{
        padding:11px 14px;
        font-size:15px;
      }
      #prevBtn,
      #nextBtn{
        min-width:110px;
        padding:12px 14px;
        font-size:15px;
      }
      .modal .card{
        padding:18px 16px;
      }
      .score{
        font-size:24px;
      }
      .note{
        font-size:14px;
      }
    }
  </style>
</head>
<body>

    <nav class="social-links" aria-label="Social links">

  </div>
  <button class="btn start-quiz-btn" id="startQuizBtn" type="button" style="display:none;">Start Quiz</button>

  <div class="quiz-container" id="quiz" aria-live="polite"></div>

  <div class="actions">
    <button class="btn btn-submit" id="nextBtn">Next</button>
    <button class="btn btn-submit" id="submitBtn" style="display:none;">Submit</button>

  <!-- Score Modal -->
  <div class="modal" id="scoreModal" role="dialog" aria-modal="true" aria-labelledby="scoreTitle" aria-describedby="scoreDesc">

      <div id="scoreDesc" class="note">—</div>

<script>
/* =========================
   Q&A DATA
  Format: Question / Option 1 / Option 2 / Option 3 / Option 4 / Correct option number
  Questions may be separated by a line break or a blank line. Line breaks inside a question are preserved.
   Example: भारत की राजधानी क्या है? / मुंबई / दिल्ली / पटना / जयपुर / 2
   ========================= */
const quizDataText = `
  मानव विकास के संदर्भ में आनुवंशिकता (Heredity) क्या तय करती है? / हमारी जन्मजात क्षमताओं की संभावित सीमा / हमारा सामाजिक व्यवहार / हमारी शिक्षा का स्तर / हमारा भाषाई परिवेश / 1
	जीन पियाजे के अनुसार 'अहंकेंद्रित चिंतन' (Egocentric Thought) किस अवस्था की मुख्य विशेषता है? / संवेदी-गामक अवस्था / मूर्त-संक्रियात्मक अवस्था / पूर्व-संक्रियात्मक अवस्था / औपचारिक संक्रियात्मक अवस्था / 3
	लेव वायगोत्स्की के अनुसार, बच्चे स्वयं को निर्देशित करने के लिए जब ऊंचे स्वर में बोलते हैं, तो उसे क्या कहते हैं? / निजी वाक (Private Speech) / आत्मकेंद्रित वाक / सामाजिक वाक / बाह्य वाक / 1
	कोहलबर्ग के नैतिक विकास के किस स्तर पर व्यक्ति 'सार्वभौमिक मानवीय अधिकारों' के आधार पर सही और गलत का फैसला करता है? / पारंपरिक स्तर / पूर्व-पारंपरिक स्तर / उत्तर-पारंपरिक स्तर / अमूर्त स्तर / 3
	एक समावेशी स्कूल में 'सार्थक अनुकूलन' (Reasonable Accommodation) का क्या अर्थ है? / बच्चों को स्कूल से बाहर निकालना / स्कूल की इमारतों और पाठ्यक्रम को बच्चों की जरूरतों के अनुसार ढालना / केवल मेधावी बच्चों को विशेष छूट देना / सभी बच्चों को एक ही तरीके से पढ़ाना / 2
	बुद्धि लब्धि (IQ) की गणना करने का सही सूत्र क्या है? / (वास्तविक आयु / मानसिक आयु) × 100 / (मानसिक आयु / वास्तविक आयु) × 100 / मानसिक आयु + वास्तविक आयु / मानसिक आयु × वास्तविक आयु / 2
	प्रगतिशील शिक्षा के संदर्भ में 'समस्या समाधान' (Problem Solving) के दौरान छात्रों की भूमिका कैसी होती है? / वे मूक दर्शक होते हैं / वे सक्रिय अन्वेषक और समाधानकर्ता होते हैं / वे केवल निर्देशों का पालन करते हैं / वे कक्षा से बाहर रहते हैं / 2
	कक्षा में जेंडर-तटस्थ भाषा (जैसे 'कैमरामैन' की जगह 'कैमरा पर्सन') का उपयोग करने से क्या बढ़ावा मिलता है? / जेंडर रूढ़िवादिता / जेंडर रूढ़िवादिता में कमी / जेंडर भेदभाव / जेंडर पृथक्करण / 2
	सतत् और व्यापक मूल्यांकन (CCE) के अंतर्गत 'व्यापक' (Comprehensive) शब्द का क्या अर्थ है? / केवल शैक्षणिक विषयों का मूल्यांकन / केवल खेलकूद का मूल्यांकन / शैक्षणिक और सह-शैक्षणिक दोनों क्षेत्रों का समग्र मूल्यांकन / केवल लिखित परीक्षाओं का मूल्यांकन / 3

	ऑटिज़्म (Autism Spectrum Disorder) से पीड़ित बच्चों का मुख्य लक्षण क्या होता है? / गणित में बहुत तेज होना / सामाजिक संचार और बातचीत में गंभीर कठिनाई / अत्यधिक गामक कौशल / बहुत अधिक बोलना / 2
	रचनात्मक (Creative) बच्चों में किस प्रकार के चिंतन की प्रधानता होती है? / अभिसारी चिंतन (Convergent) / अपसारी चिंतन (Divergent) / चिंतन का अभाव / केवल रटने का चिंतन / 2
	अर्थपूर्ण अधिगम को बढ़ावा देने के लिए एक शिक्षक को कक्षा में कैसा वातावरण बनाना चाहिए? / भय और तनाव का / सहयोगात्मक और सुरक्षित / अत्यधिक प्रतिस्पर्धात्मक / पूरी तरह उदासीन / 2
	'समीपस्थ विकास का क्षेत्र' (ZPD) की अवधारणा में 'समीपस्थ' शब्द क्या दर्शाता है? / बच्चे के घर के पास का क्षेत्र / वह क्षेत्र जहाँ बच्चा थोड़ी सी सहायता से लक्ष्य तक पहुँचने के बिल्कुल करीब होता है / विद्यालय के पास का क्षेत्र / आनुवंशिक विकास की सीमा / 2
	जब छात्र किसी कार्य को केवल 'सजा से बचने' के लिए करते हैं, तो उनकी प्रेरणा का स्तर कैसा होता है? / आंतरिक रूप से अभिप्रेरित / बाह्य रूप से अभिप्रेरित / स्वतः अभिप्रेरित / प्रेरणाहीन / 2
	शिक्षार्थियों में 'स्व-नियमन' (Self-Regulation) कौशल का क्या अर्थ है? / शिक्षकों के नियमों का आँख बंद करके पालन करना / अपने स्वयं के सीखने की निगरानी और नियंत्रण करने की क्षमता / परीक्षा में चोरी करना / शांत बैठकर निष्क्रिय रहना / 2
	विकास के किस चरण को 'तूफान और तनाव की अवस्था' (Period of Storm and Stress) कहा जाता है? / शैशवावस्था / बाल्यावस्था / किषाेरावस्था / प्रौढ़ावस्था / 3
	प्राथमिक समाजीकरण (Primary Socialization) की प्रक्रिया कब शुरू होती है? / किशोरावस्था में / बाल्यावस्था के अंत में / शिशु के जन्म के तुरंत बाद घर-परिवार से / विद्यालय जाने पर / 3
	गार्डनर के बहुबुद्धि सिद्धांत के अनुसार, एक कवि या लेखक के पास किस बुद्धि की अधिकता होती है? / स्थानिक बुद्धि / तार्किक बुद्धि / भाषाई बुद्धि / शारीरिक-गामक बुद्धि / 3
	बच्चों के संज्ञानात्मक विकास में 'खेल' (Play) की क्या भूमिका है? / यह केवल समय की बर्बादी है / यह बच्चों को गामक, सामाजिक और संज्ञानात्मक रूप से तलाशने और सीखने में मदद करता है / यह पढ़ाई से ध्यान भटकाता है / इसका कोई महत्व नहीं है / 2
	पियाजे के अनुसार 'मूर्त-संक्रियात्मक अवस्था' का आयु वर्ग क्या है? / 0 से 2 वर्ष / 2 से 7 वर्ष / 7 से 11 वर्ष / 11 वर्ष से अधिक / 3
	अधिगम का 'सामाजिक-रचनावादी दृष्टिकोण' (Socio-Constructivist Perspective) किस पर बल देता है? / केवल पुरस्कार और दंड पर / ज्ञान के निर्माण में सामाजिक अंतःक्रिया और संदर्भ पर / केवल व्याख्यान विधि पर / रटने की आदत पर / 2
	प्राथमिक कक्षाओं में 'अनुभवजन्य अधिगम' (Experiential Learning) को कैसे बढ़ावा दिया जा सकता है? / बच्चों को केवल परिभाषाएं याद कराकर / प्रत्यक्ष गतिविधियों, प्रयोगों और अवलोकन के अवसर देकर / गृहकार्य का बोझ बढ़ाकर / केवल पाठ्यपुस्तक पढ़वाकर / 2
	बच्चों के विकास के संदर्भ में 'संवेदनशील अवधि' (Sensitive Period) का क्या अर्थ है? / वह समय जब बच्चा बहुत बीमार होता है / वह काल जब बच्चा किसी विशिष्ट क्षमता को सीखने के लिए अत्यधिक ग्रहणशील होता है / किशोरावस्था का समय / परीक्षा के ठीक पहले का समय / 2
	छात्र तब बेहतर सीखते हैं जब कोई संप्रत्यय (Concept) पढ़ाया जाता है: / अमूर्त से मूर्त की ओर / बहुत जटिल से सरल की ओर / सरल और मूर्त से अमूर्त की ओर / पूरी तरह से अप्रासंगिक तरीके से / 3
	बच्चों के अधिगम में 'स्कैफोल्डिंग' (Scaffolding/पाड़) का एक उदाहरण क्या है? / बच्चे को पूरा उत्तर लिखकर दे देना / बच्चे को संकेत देना या आधा हल किया हुआ उदाहरण प्रदान करना / बच्चे को कक्षा से बाहर कर देना / बच्चे को याद करने के लिए कहना / 2
	विकास का 'समीप-दूरस्थ' (Proximodistal) सिद्धांत क्या बताता है? / विकास सिर से पैर की ओर होता है / विकास शरीर के केंद्र से बाहर की ओर बढ़ता है / विकास पैर से सिर की ओर होता है / विकास पूरी तरह से रुक-रुक कर होता है / 2
	एक शिक्षिका अपनी कक्षा में बच्चों की 'विविधता' (Diversity) को कैसे स्वीकार कर सकती है? / सभी बच्चों को एक ही लाठी से हांक कर / बच्चों की व्यक्तिगत भिन्नताओं और सांस्कृतिक पृष्ठभूमियों का सम्मान करके / कमजोर बच्चों को अलग सेक्शन में डालकर / केवल अमीर बच्चों को प्राथमिकता देकर / 2
	अल्फ्रेड बिने का संबंध मुख्य रूप से किसके मापन से है? / रचनात्मकता / व्यक्तित्व / बुद्धि / शारीरिक क्षमता / 3
भाग 2: भाषा 1 (हिंदी)
	प्राथमिक स्तर पर भाषा शिक्षण का मुख्य उद्देश्य बच्चों में क्या विकसित करना है? / कठिन शब्दों की वर्तनी रटना / अपनी बात को दूसरों के सामने सहजता से व्यक्त करने का आत्मविश्वास / परीक्षा में पूरे अंक लाना / केवल व्याकरण के नियम याद करना / 2
	'भाषा अर्जन' (Language Acquisition) के बारे में कौन सा कथन सत्य है? / यह केवल व्याकरण की किताबों से होता है / यह एक स्वाभाविक, सहज और अनौपचारिक प्रक्रिया है / इसके लिए विद्यालय जाना अनिवार्य है / यह एक बहुत ही कठिन और सप्रयास प्रक्रिया है / 2
	भाषा अधिगम (Language Learning) में सबसे महत्वपूर्ण तत्व क्या माना जाता है? / पाठ्यपुस्तक का आकार / समृद्ध भाषाई परिवेश और अभ्यास / केवल शिक्षक का व्याख्यान / कठिन परीक्षाओं का आयोजन / 2
	प्राथमिक स्तर पर 'पठन' (Reading) की शुरुआत करने के लिए सबसे कम महत्वपूर्ण क्या है? / अर्थ समझना / वर्णमाला के अक्षरों का क्रम याद करना / संदर्भ के अनुसार अनुमान लगाना / चित्रों को देखकर समझना / 2

	'चौराहा' शब्द में कौन सा समास है? / तत्पुरुष समास / द्वंद्व समास / द्विगु समास / अव्ययीभाव समास / 3
	बच्चों की भाषाई त्रुटियाँ (Errors) एक शिक्षक को क्या संकेत देती हैं? / बच्चे लापरवाह हैं / बच्चों के सीखने की प्रक्रिया और उनके सोचने के तरीके की समझ / बच्चों को भाषा नहीं सिखाई जा सकती / शिक्षक असफल है / 2
	भाषा की कक्षा में 'प्रिंट-समृद्ध वातावरण' का क्या लाभ है? / कक्षा सुंदर दिखती है / बच्चों को अनजाने में भी भाषा प्रयोग और शब्दों को देखने के भरपूर अवसर मिलते हैं / फर्नीचर का खर्च बचता है / बच्चे शांत रहते हैं / 2
	'उपचारात्मक शिक्षण' (Remedial Teaching) कब किया जाना चाहिए? / सत्रांत परीक्षा के तुरंत पहले / निदानात्मक परीक्षण (Diagnostic Test) द्वारा कमियों को पहचानने के बाद / केवल छुट्टियों के दिनों में / बिना किसी कारण के कभी भी / 2
	प्राथमिक स्तर पर भाषा के आकलन के लिए सबसे प्रभावी उपकरण क्या है? / केवल बहुविकल्पीय परीक्षा / पोर्टफोलियो (Portfolio) / हुबहू नकल करने का सुलेख / कठिन शब्दों का डिक्टेशन / 2
	'लड़की ने पुस्तक पढ़ी'—इस वाक्य में कौन सा काल है? / सामान्य भूतकाल / पूर्ण भूतकाल / वर्तमान काल / भविष्य काल / 2
	'प्रत्यक्ष विधि' (Direct Method) में भाषा सिखाते समय किसका प्रयोग पूरी तरह वर्जित होता है? / चित्रों का / मातृभाषा का / दृश्यात्मक साधनों का / कहानियों का / 2
	'भाषा के चार कौशल' का सही मनोवैज्ञानिक क्रम क्या माना जाता है? / लिखना, पढ़ना, बोलना, सुनना / सुनना, बोलना, पढ़ना, लिखना / बोलना, सुनना, लिखना, पढ़ना / पढ़ना, लिखना, सुनना, बोलना / 2
	'चोमस्की' के अनुसार बच्चों में भाषा सीखने की क्षमता कैसी होती है? / पूरी तरह से सामाजिक अंतःक्रिया पर निर्भर / जन्मजात और प्राकृतिक / केवल पुरस्कार पर आधारित / बिल्कुल शून्य / 2
	'आगमन विधि' (Inductive Method) का मुख्य लाभ क्या है? / बच्चे नियम कभी नहीं भूलते क्योंकि वे स्वयं उदाहरणों से नियम तक पहुँचते हैं / समय बहुत कम लगता है / शिक्षक को मेहनत नहीं करनी पड़ती / यह केवल उच्च कक्षाओं के लिए है / 1
	'पवन' शब्द का सही संधि-विच्छेद क्या है? / प + वन / पो + अन / पौ + अन / पव + अन / 2
	'आंखों का तारा' मुहावरे का सही अर्थ क्या है? / आँखों में चोट लगना / बहुत प्यारा होना / अंधा होना / तारा दिखाई देना / 2
	निम्नलिखित में से कौन सा शब्द 'शुद्ध' रूप में लिखा गया है? / आशिर्वाद / आशीर्वाद / आशिरवाद / असीर्वाद / 2
	बच्चों में 'लेखन कौशल' (Writing skill) के विकास का सबसे अच्छा तरीका क्या है? / सुंदर अक्षरों की बार-बार नकल करना / अपने अनुभवों और विचारों को स्वतंत्र रूप से लिखना / कठिन शब्दों की सूची बनाना / परिभाषाएं याद करना / 2
	'त्रिभाषा सूत्र' (Three Language Formula) की सिफारिश किस आयोग ने की थी? / कोठारी आयोग / मुदालियर आयोग / राधाकृष्णन आयोग / सार्जेंट आयोग / 1
	बच्चों की मौखिक अभिव्यक्ति के विकास के लिए कौन सी गतिविधि सबसे कम प्रभावी है? / रोल प्ले / कहानी को अपने शब्दों में सुनाना / प्रश्नों के उत्तरों को हूबहू रटकर सुनाना / परिचर्चा में भाग लेना / 3
	'सूर्य' का पर्यायवाची शब्द निम्नलिखित में से कौन सा है? / सुधाकर / प्रभाकर / निशाकर / राकेश / 2
	'अनुराग' शब्द का सही विलोम शब्द क्या होगा? / विराग / प्रेम / नफ़रत / राग / 1

	अजगर (Python) के बारे में कौन सा कथन सत्य है? / यह भारत का सबसे जहरीला सांप है / यह जहरीला नहीं होता और शिकार को निगल जाता है / इसके काटने पर तुरंत मौत हो जाती है / इसके कान बहुत बड़े होते हैं / 2
	EVS शिक्षण में 'अन्वेषण आधारित शिक्षा' (Inquiry-based learning) का मुख्य लाभ क्या है? / पाठ्यक्रम बहुत तेजी से समाप्त होता है / छात्रों में वैज्ञानिक जिज्ञासा और खोजी दृष्टिकोण का विकास होता है / शिक्षक को कम बोलना पड़ता है / छात्र निष्क्रिय रहते हैं / 2
	कश्मीर की प्रसिद्ध 'हाउसबोट' की छतों पर की जाने वाली लकड़ी की सुंदर नक्काशी को क्या कहा जाता है? / मेहराब / खत्मबंद / डूँगा / नक्काशी / 2
	दक्षिण भारत के केरल राज्य में परिवहन के लिए उपयोग की जाने वाली पारंपरिक छोटी लकड़ी की नाव को क्या कहते हैं? / शिकारा / फेरी या वल्लम / फेनिल / डोंगी / 2
	भारत के किस उत्तर-पूर्वी राज्य में 'बांस के खंभों' पर ऊंचे घर (जमीन से 10-12 फीट ऊपर) बनाए जाते हैं ताकि बाढ़ से बचा जा सके? / मिजोरम / असम / मेघालय / त्रिपुरा / 2
	साँपों के संदर्भ में, 'कालबेलिया' क्या है? / एक प्रकार की जहरीली जड़ी-बूटी / सँपेरों की एक जनजाति और उनका प्रसिद्ध नृत्य / एक प्रकार का वाद्य यंत्र / साँप का घोंसला / 2
	खाद्य संरक्षण के लिए किस पदार्थ का उपयोग 'परिरक्षक' (Preservative) के रूप में प्रचुर मात्रा में किया जाता है? / पानी / नमक और चीनी / केवल दूध / सिरका और तेल / 2
	प्राथमिक स्तर पर EVS की कक्षा में 'समूह अधिगम' (Group Learning) का क्या महत्व है? / यह बच्चों में शोर मचाने की आजादी देता है / यह बच्चों में सामाजिक कौशल, सहयोग और सहकर्मी अधिगम को बढ़ावा देता है / यह शिक्षक का काम बढ़ाता है / यह व्यक्तिगत पहचान मिटा देता है / 2
	पेट्रोलियम (कच्चे तेल) के निष्कर्षण और शोधन से हमें क्या प्राप्त होता है? / केवल कोयला / मोम, स्नेहक तेल, डीजल, केरोसिन और एलपीजी / केवल लोहा और तांबा / कांच और प्लास्टिक / 2
	निम्नलिखित में से कौन सा खाद्य पदार्थ एक 'रूपांतरित तना' (Modified Stem) है, जड़ नहीं? / गाजर / आलू / मूली / शकरकंद / 2
	अमृता देवी बिश्नोई राष्ट्रीय पुरस्कार भारत सरकार द्वारा किस क्षेत्र में उत्कृष्ट योगदान के लिए दिया जाता है? / खेलकूद / वन्यजीव और पर्यावरण संरक्षण / शास्त्रीय नृत्य / विज्ञान अनुसंधान / 2
	वाहनों से निकलने वाले धुएं में पाई जाने वाली वह कौन सी विषैली गैस है जो रक्त में ऑक्सीजन ले जाने की क्षमता को कम कर देती है? / कार्बन डाइऑक्साइड / कार्बन मोनोऑक्साइड (CO) / नाइट्रोजन / आर्गन / 2











`;

const recordPattern = /([\s\S]*?)\s*\/\s*([^/]*?)\s*\/\s*([^/]*?)\s*\/\s*([^/]*?)\s*\/\s*([^/]*?)\s*\/\s*([1-4])(?=\s|$)/g;
const quizData = [...quizDataText.trim().matchAll(recordPattern)].map((match, index) => {
  const fields = match.slice(1).map((field) => field.trim());
  if (fields.length !== 6) {
    throw new Error(`Question ${index + 1} must have 6 fields separated by /`);
  }
  const correctOption = Number(fields[5]);
  if (!Number.isInteger(correctOption) || correctOption < 1 || correctOption > 4) {
    throw new Error(`Question ${index + 1} correct option must be a number from 1 to 4`);
  }
  return { q: fields[0], o: fields.slice(1, 5), a: correctOption - 1 };
});

function formatQuestion(question) {
  return /[?؟]\s*$/.test(question) ? question : `${question}?`;
}

/* ================
   Sequential quiz flow
   ================ */
const quizEl = document.getElementById("quiz");
const startQuizBtn = document.getElementById("startQuizBtn");
const nextBtn = document.getElementById("nextBtn");
const submitBtn = document.getElementById("submitBtn");
const restartBtn = document.getElementById("restartBtn");
const scoreModal = document.getElementById("scoreModal");
const scoreTitle = document.getElementById("scoreTitle");
const scoreDesc = document.getElementById("scoreDesc");
const showAnswersBtn = document.getElementById("showAnswersBtn");
let currentQuestionIndex = 0;
let reviewMode = false;
let questionTimerId = null;
const totalTimeSeconds = 7200;
let timeLeft = totalTimeSeconds;
let timerStarted = false;
const userAnswers = new Array(quizData.length).fill(null);

function formatTime(totalSeconds) {
  const hours = Math.floor(totalSeconds / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;
  return [hours, minutes, seconds].map((value) => String(value).padStart(2, "0")).join(":");
}

function clearQuestionTimer() {
  if (questionTimerId) {
    clearInterval(questionTimerId);
    questionTimerId = null;
  }
}

function startQuestionTimer() {
  clearQuestionTimer();
  if (reviewMode) return;

  timerStarted = true;
  const timerBox = document.getElementById("questionTimer");
  if (timerBox) {
    timerBox.textContent = `Time: ${formatTime(timeLeft)}`;
  }

  questionTimerId = setInterval(() => {
    timeLeft -= 1;
    if (timerBox) {
      timerBox.textContent = `Time: ${formatTime(timeLeft)}`;
    }

    if (timeLeft <= 0) {
      clearQuestionTimer();
      submitQuiz();
    }
  }, 1000);
}

function updateControls() {
  const isLast = currentQuestionIndex === quizData.length - 1;

  nextBtn.style.display = reviewMode ? (isLast ? "none" : "inline-block") : "inline-block";
  submitBtn.style.display = "none";
  restartBtn.style.display = reviewMode ? "inline-block" : "none";

  nextBtn.textContent = isLast && !reviewMode ? "Submit" : "Next";
}

function showStartScreen() {
  clearQuestionTimer();
  timerStarted = false;
  timeLeft = totalTimeSeconds;
  reviewMode = false;
  currentQuestionIndex = 0;
  quizEl.innerHTML = "";
  startQuizBtn.style.display = "inline-flex";
}

function startQuiz() {
  timeLeft = totalTimeSeconds;
  timerStarted = true;
  reviewMode = false;
  currentQuestionIndex = 0;
  startQuizBtn.style.display = "none";
  renderQuestion();
}

function renderQuestion() {
  clearQuestionTimer();
  quizEl.innerHTML = "";

  const currentQuestion = quizData[currentQuestionIndex];
  const selectedAnswer = userAnswers[currentQuestionIndex];
  const questionAnswered = selectedAnswer !== null;

  const metaRow = document.createElement("div");
  metaRow.className = "question-meta";

  const startWrap = document.createElement("div");
  startWrap.className = "start-quiz-wrap";
  startWrap.appendChild(startQuizBtn);

  const quizTitle = document.createElement("h1");
  quizTitle.id = "quizTitle";
  quizTitle.textContent = "CTET 1-5";

  const counter = document.createElement("div");
  counter.id = "questionCounter";
  counter.className = "meta-box";
  counter.textContent = `Question ${currentQuestionIndex + 1}/${quizData.length}`;

  const timer = document.createElement("div");
  timer.id = "questionTimer";
  timer.className = "meta-box";
  timer.textContent = `Time: ${formatTime(timerStarted ? timeLeft : totalTimeSeconds)}`;

  metaRow.appendChild(counter);
  metaRow.appendChild(startWrap);
  metaRow.appendChild(quizTitle);
  metaRow.appendChild(timer);
  startQuizBtn.style.display = timerStarted || reviewMode ? "none" : "inline-flex";
  quizEl.appendChild(metaRow);

  const card = document.createElement("div");
  card.className = "question";

  const title = document.createElement("p");
  title.className = "q-title";
  title.textContent = `${String(currentQuestionIndex + 1).padStart(2, "0")}. ${formatQuestion(currentQuestion.q)}`;

  const opts = document.createElement("div");
  opts.className = "options";

  currentQuestion.o.forEach((opt, optionIndex) => {
    const id = `q${currentQuestionIndex}-o${optionIndex}`;
    const label = document.createElement("label");
    label.className = "option";
    label.setAttribute("for", id);

    const input = document.createElement("input");
    input.type = "radio";
    input.id = id;
    input.name = `q${currentQuestionIndex}`;
    input.value = optionIndex;
    input.checked = selectedAnswer === optionIndex;

    if (reviewMode || questionAnswered) {
      input.disabled = true;
      if (optionIndex === currentQuestion.a) {
        label.classList.add("correct");
      }
      if (selectedAnswer === optionIndex && selectedAnswer !== currentQuestion.a) {
        label.classList.add("incorrect");
      }
    } else {
      input.addEventListener("change", () => {
        userAnswers[currentQuestionIndex] = Number(input.value);
        if (!timerStarted) {
          timeLeft = totalTimeSeconds;
          timerStarted = true;
          startQuestionTimer();
        }
        renderQuestion();
      });
    }

    const span = document.createElement("span");
    span.className = "option-text";
    span.textContent = opt;

    label.appendChild(input);
    label.appendChild(span);
    opts.appendChild(label);
  });

  card.appendChild(title);
  card.appendChild(opts);

  if (reviewMode || questionAnswered) {
    const result = document.createElement("div");
    result.className = "result-message";
    result.style.display = "none";
    card.appendChild(result);
  }

  quizEl.appendChild(card);

  title.style.height = "auto";
  const lineHeight = parseFloat(getComputedStyle(title).lineHeight);
  if (title.scrollHeight > lineHeight * 3 + 1) {
    title.classList.add("dense");
  }
  title.style.height = "";

  updateControls();

  if (!reviewMode && timerStarted) {
    startQuestionTimer();
  }
}

function showAnswers() {
  clearQuestionTimer();
  timerStarted = false;
  reviewMode = true;
  currentQuestionIndex = 0;
  renderQuestion();
  scoreModal.style.display = "none";
}

function submitQuiz() {
  clearQuestionTimer();
  timerStarted = false;

  let score = 0;
  let attempted = 0;
  quizData.forEach((item, qi) => {
    if (userAnswers[qi] !== null) {
      attempted++;
      if (Number(userAnswers[qi]) === item.a) score++;
    }
  });

  scoreTitle.textContent = `आपका स्कोर: ${score}/${quizData.length}`;
  const incorrect = attempted - score;
  const notAttempted = quizData.length - attempted;
  scoreDesc.textContent = `सही उत्तर: ${score} • गलत उत्तर: ${incorrect} • Not Attempted: ${notAttempted}`;
  scoreModal.style.display = "flex";
}

nextBtn.addEventListener("click", () => {
  if (reviewMode) {
    if (currentQuestionIndex < quizData.length - 1) {
      currentQuestionIndex += 1;
      renderQuestion();
    }
  } else {
    if (!timerStarted) {
      timeLeft = totalTimeSeconds;
      timerStarted = true;
    }

    if (currentQuestionIndex < quizData.length - 1) {
      currentQuestionIndex += 1;
      renderQuestion();
    } else {
      submitQuiz();
    }
  }
  window.scrollTo({ top: 0, behavior: "smooth" });
});

submitBtn.addEventListener("click", submitQuiz);

startQuizBtn.addEventListener("click", startQuiz);
showAnswersBtn.addEventListener("click", restartQuiz);

function restartQuiz() {
  clearQuestionTimer();
  timerStarted = false;
  timeLeft = totalTimeSeconds;
  reviewMode = false;
  currentQuestionIndex = 0;
  userAnswers.fill(null);
  scoreModal.style.display = "none";
  renderQuestion();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

restartBtn.addEventListener("click", restartQuiz);

scoreModal.addEventListener("click", (e) => {
  if (e.target === scoreModal) scoreModal.style.display = "none";
});

renderQuestion();

</script>
