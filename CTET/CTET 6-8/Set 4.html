
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
  <title>करेंट अफेयर्स</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@400;600;700;800&display=swap');

    :root{
      --bg:#dfe9fb;
      --card:#ffffff;
      --text:#222;
      --muted:#6b7280;
      --accent:#2563eb;
      --ok:#16a34a;
      --bad:#dc2626;
      --border:#e5e7eb;
      --radius:14px;
      --space:14px;

      /* Base font sizes (mobile-first) */
      --fs-body:19px;
      --fs-label:19px;
      --fs-h1:27px;
      --fs-brand:31px; /* ~2pt (≈2.66px) बड़ा than h1 */
      --fs-btn:19px;
    }
    @media (min-width:480px){
      :root{
        --fs-body:19px;
        --fs-label:20px;
        --fs-h1:29px;
        --fs-brand:33px;
        --fs-btn:19px;
      }
    }
    @media (min-width:768px){
      :root{
        --fs-body:19px;
        --fs-label:21px;
        --fs-h1:31px;
        --fs-brand:35px;
        --fs-btn:19px;
      }
    }

    *{box-sizing:border-box}
    html {
      height: 100%;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    html::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;
    }
    body{
      margin:0;
      padding:8px 14px 24px;
      min-height:100vh;
      font-family:"Noto Serif Devanagari","Sanskrit Text","Noto Sans Devanagari","Nirmala UI",Mangal,serif;
      background:var(--bg);
      color:var(--text);
      line-height:1.5;
      font-size:var(--fs-body);
      box-sizing:border-box;
      overflow-x:hidden;
      overflow-y:auto;
      scrollbar-width:none;
      -ms-overflow-style:none;
      -webkit-text-size-adjust:100%;
      text-rendering:optimizeLegibility;
    }
    body::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;
    }
    .site-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      max-width:980px;
      margin:0 auto;
      position:relative;
    }
    .brand{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      font-weight:800;
      color:#ef4444; /* red */
      font-size:var(--fs-brand);
      letter-spacing:.2px;
    }
    .social-links{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:8px;
      margin-left:auto;
    }
    .social-link{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:38px;
      height:38px;
      border-radius:50%;
      color:#fff;
      text-decoration:none;
      transition:transform .15s ease, box-shadow .15s ease;
    }
    .social-link:hover{
      transform:translateY(-1px);
      box-shadow:0 5px 12px rgba(15,23,42,.2);
    }
    .social-link svg{
      width:21px;
      height:21px;
      fill:currentColor;
    }
    .youtube-link{ background:#ef4444; }
    .telegram-link{ background:#0ea5e9; }
    .whatsapp-link{ background:#22c55e; }
    .social-link:focus-visible{
      outline:3px solid rgba(37,99,235,.45);
      outline-offset:3px;
    }
    h1{
      text-align:center;
      font-size:var(--fs-h1);
      margin:12px 0 18px;
      color:#111827;
    }
    #quizTitle{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      margin:0;
      font-size:var(--fs-h1);
      line-height:1.2;
      white-space:nowrap;
    }

    .quiz-container{
      max-width:980px;
      margin:0 auto;
      display:grid;
      gap:6px;
    }
    .question{
      background:linear-gradient(135deg, #f8fbff 0%, #eef6ff 38%, #eaf1ff 100%);
      border:1px solid rgba(147, 197, 253, 0.65);
      border-radius:var(--radius);
      padding:16px;
      height:410px;
      overflow:hidden;
      box-shadow:0 6px 22px rgba(59, 130, 246, 0.12);
    }
    .question-meta{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin:0 0 10px;
      position:relative;
    }
    .meta-box{
      display:inline-flex;
      align-items:center;
      min-height:42px;
      padding:8px 14px;
      border-radius:10px;
      background:rgba(255,255,255,0.18);
      border:1px solid rgba(59, 130, 246, 0.25);
      color:#1f2937;
      font-weight:800;
      font-size:1.05rem;
      box-shadow:0 2px 10px rgba(59, 130, 246, 0.1);
      text-align:left;
      line-height:1.4;
    }
    #questionCounter{
      justify-content:flex-start;
      min-width:150px;
    }
    #questionTimer{
      justify-content:flex-end;
      min-width:120px;
      margin-left:auto;
    }
    .q-title{
      font-weight:800;
      font-size:1.25rem;
      line-height:1.7;
      white-space:pre-line;
      height:auto;
      overflow:hidden;
      margin:0 0 4px;
      color:#0f172a;
      text-shadow:none;
    }
    .q-title.compact{
      font-size:1.1rem;
      line-height:1.55;
    }
    .q-title.dense{
      font-size:1rem;
      line-height:1.45;
    }
    .options{
      display:flex;
      flex-direction:column;
      gap:10px; /* vertical spacing line by line */
    }

    /* Each option as a separate box */
    .options label.option{
      display:flex;
      align-items:center;
      gap:12px;
      padding:12px 14px;
      border:2px solid rgba(96, 165, 250, 0.5);
      border-radius:12px;
      background:linear-gradient(135deg, #ffffff 0%, #edf6ff 100%);
      cursor:pointer;
      transition:all .15s ease;
      font-size:var(--fs-label);
      user-select:none;
      color:#0f172a;
    }
    .options label.option:hover{
      border-color:#60a5fa;
      background:linear-gradient(135deg, #f8fbff 0%, #e0ecff 100%);
    }
    .option-text{
      flex:1;
      line-height:1.5;
      color:#0f172a;
      font-weight:700;
      text-shadow:none;
    }

    /* Bigger radio for mobile */
    .options input[type="radio"]{
      appearance:none;
      width:26px;
      height:26px;
      min-width:26px;
      min-height:26px;
      border:2px solid #9ca3af;
      border-radius:50%;
      display:inline-block;
      position:relative;
      outline:none;
      transition:border-color .15s ease, box-shadow .15s ease;
      background:#fff;
    }
    .options input[type="radio"]:checked{
      border-color:#60a5fa;
      box-shadow:0 0 0 3px rgba(96,165,250,0.12);
    }
    .options input[type="radio"]::after{
      content:"";
      position:absolute;
      inset:5px;
      border-radius:50%;
      background:transparent;
      transition:background .15s ease;
    }
    .options input[type="radio"]:checked::after{
      background:#60a5fa;
    }
    .options input[type="radio"]:checked ~ .option-text,
    .options label.option:has(input:checked) .option-text{
      color:#0f172a;
      text-shadow:none;
    }
    .options label.option:has(input:checked){
      background:linear-gradient(135deg, #ffffff 0%, #edf6ff 100%);
      border-color:#60a5fa;
      box-shadow:none;
    }

    /* Correct/Incorrect colors */
    .option.correct{
      background:#dcfce7 !important;
      border-color:var(--ok) !important;
    }
    .option.incorrect{
      background:#fee2e2 !important;
      border-color:var(--bad) !important;
    }
    .result-message{
      margin-top:12px;
      padding:10px 12px;
      border-radius:10px;
      background:rgba(255,255,255,0.8);
      border:1px solid rgba(148, 163, 184, 0.4);
      font-weight:800;
      line-height:1.5;
    }

    /* Buttons row (submit + restart) */
    .actions{
      position:sticky;
      bottom:0;
      left:0; right:0;
      background:rgba(247,247,251,.85);
      backdrop-filter: blur(6px);
      border-top:1px solid var(--border);
      padding:12px 10px;
      display:flex;
      gap:10px;
      justify-content:center;
      z-index:5;
    }
    .btn{
      border:0;
      border-radius:999px;
      padding:12px 18px;
      font-weight:700;
      font-size:var(--fs-btn);
      cursor:pointer;
      box-shadow:0 4px 14px rgba(0,0,0,.08);
      transition:transform .15s ease, box-shadow .15s ease;
    }
    .start-quiz-wrap{
      display:flex;
      justify-content:flex-start;
      align-items:center;
      margin:0;
    }
    .start-quiz-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:38px;
      min-width:116px;
      padding:8px 11px;
      border-radius:10px;
      background:linear-gradient(135deg, #2563eb, #7c3aed);
      color:#fff;
      font-size:.8rem;
      font-weight:800;
      line-height:1.2;
      box-shadow:0 8px 18px rgba(37, 99, 235, 0.2);
      margin-left:0;
    }
    .start-quiz-btn:disabled{
      opacity:0.75;
      cursor:not-allowed;
    }
    .btn:hover{
      transform:translateY(-1px);
      box-shadow:0 8px 18px rgba(0,0,0,.12);
    }
    .btn-submit{ background:#22c55e; color:#fff; }
    .btn-final-submit{ background:#7c3aed; color:#fff; }
    .btn-restart{ background:#ef4444; color:#fff; }
    #prevBtn,
    #nextBtn{
      min-width:150px;
      font-size:20px;
      padding:14px 22px;
      background:linear-gradient(135deg, #2563eb, #7c3aed);
      color:#fff;
      box-shadow:none;
      border:0;
      outline:none;
    }

    #prevBtn:hover,
    #nextBtn:hover{
      box-shadow:none;
    }

    /* Score modal */
    .modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.4);
      display:none;
      align-items:center;
      justify-content:center;
      padding:20px;
      z-index:50;
    }
    .modal .card{
      background:#fff;
      border-radius:18px;
      padding:24px;
      width:min(520px, 96vw);
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,.2);
    }
    .score{
      font-size:28px;
      font-weight:800;
      margin:8px 0 2px;
      color:#111827;
    }
    .note{
      font-size:16px;
      color:var(--muted);
      margin-bottom:14px;
    }
    .modal .btn{
      width:100%;
    }
    .sr-only{
      position:absolute!important;
      height:1px;width:1px;
      overflow:hidden;clip:rect(1px,1px,1px,1px);
      white-space:nowrap;border:0;padding:0;margin:-1px;
    }

    @media (max-width: 480px){
      body{
        padding:8px 10px 18px;
      }
      .site-header{
        gap:10px;
      }
      .brand{
        font-size:24px;
        line-height:1.3;
      }
      .social-links{
        gap:6px;
      }
      .social-link{
        width:34px;
        height:34px;
      }
      .social-link svg{
        width:18px;
        height:18px;
      }
      h1{
        font-size:24px;
        margin-bottom:12px;
      }
      .quiz-container{
        gap:4px;
      }
      .question{
        padding:12px;
        height:360px;
      }
      .question-meta{
        gap:8px;
        align-items:center;
        flex-wrap:wrap;
      }
      .meta-box{
        min-height:36px;
        padding:7px 10px;
        font-size:0.9rem;
      }
      #questionCounter{
        min-width:0;
      }
      #questionTimer{
        min-width:90px;
      }
      .start-quiz-btn{
        min-height:34px;
        min-width:104px;
        padding:7px 9px;
        font-size:.76rem;
      }
      .q-title{
        font-size:1.08rem;
        line-height:1.6;
        height:auto;
        margin-bottom:4px;
        word-break:break-word;
      }
      .q-title.dense{
        font-size:.92rem;
        line-height:1.4;
      }
      .options{
        gap:8px;
      }
      .options label.option{
        align-items:flex-start;
        gap:10px;
        padding:10px 12px;
      }
      .option-text{
        font-size:0.95rem;
        line-height:1.5;
        word-break:break-word;
      }
      .actions{
        padding:10px 8px 12px;
        gap:8px;
      }
      .btn{
        padding:11px 14px;
        font-size:15px;
      }
      #prevBtn,
      #nextBtn{
        min-width:110px;
        padding:12px 14px;
        font-size:15px;
      }
      .modal .card{
        padding:18px 16px;
      }
      .score{
        font-size:24px;
      }
      .note{
        font-size:14px;
      }
    }
  </style>
</head>
<body>

    <nav class="social-links" aria-label="Social links">

  <div class="quiz-container" id="quiz" aria-live="polite"></div>

<script>
/* =========================
   Q&A DATA
  Format: Question / Option 1 / Option 2 / Option 3 / Option 4 / Correct option number
  Questions may be separated by a line break or a blank line. Line breaks inside a question are preserved.
   Example: भारत की राजधानी क्या है? / मुंबई / दिल्ली / पटना / जयपुर / 2
   ========================= */
const quizDataText = `
बालक के विकास में वंशानुक्रम और वातावरण का संबंध किस प्रकार का माना जाता है? / दोनों की परस्पर क्रिया विकास को प्रभावित करती है / केवल वंशानुक्रम जिम्मेदार है / केवल वातावरण जिम्मेदार है / दोनों का कोई संबंध नहीं है / 2

सीखने की प्रक्रिया में तत्परता से क्या आशय है? / केवल आयु बढ़ना / सीखने के लिए आवश्यक मानसिक एवं शारीरिक तैयारी / केवल परीक्षा की तैयारी / केवल गृहकार्य करना / 2

यदि शिक्षक बच्चों को किसी समस्या के अनेक समाधान खोजने देता है, तो वह किस क्षमता को बढ़ावा देता है? / रचनात्मक चिंतन / केवल स्मृति / केवल अनुकरण / केवल लेखन / 1

कक्षा में बच्चे प्रश्नों के अलग-अलग उत्तर देते हैं। शिक्षक के लिए सबसे उपयुक्त दृष्टिकोण क्या होगा? / केवल सही उत्तर स्वीकार करना / उत्तरों के पीछे के तर्क पर चर्चा करना / सभी उत्तर गलत मानना / केवल पाठ्यपुस्तक का उत्तर बताना / 2

अधिगम को स्थायी बनाने में पुनरावृत्ति कब अधिक प्रभावी होती है? / जब वह अर्थपूर्ण गतिविधियों से जुड़ी हो / जब बिना समझे रटाया जाए / केवल परीक्षा के एक दिन पहले / केवल गृहकार्य के रूप में / 3

शिक्षक द्वारा संकेत देकर विद्यार्थी को उत्तर तक पहुँचाना किसका उदाहरण है? / दंड / मार्गदर्शित अधिगम / प्रतियोगिता / अनुशासन / 2

बालक के सामाजिक विकास में खेल की क्या भूमिका है? / सहयोग और सामाजिक व्यवहार के अवसर देता है / केवल मनोरंजन करता है / सीखने में बाधा डालता है / केवल शारीरिक विकास करता है / 4

कक्षा में कमजोर प्रदर्शन करने वाले विद्यार्थी के लिए शिक्षक को सबसे पहले क्या करना चाहिए? / सीखने की कठिनाई का कारण जानना / उसे कम अंक देना / उसे अलग बैठाना / उसे अधिक गृहकार्य देना / 1

संज्ञानात्मक विकास का संबंध मुख्यतः किससे है? / सोचने और समझने की प्रक्रियाओं से / केवल शारीरिक वृद्धि से / केवल भावनाओं से / केवल सामाजिक स्थिति से / 2

यदि विद्यार्थी किसी अवधारणा को अपने अनुभव से जोड़कर समझाता है, तो यह किस प्रकार के अधिगम को दर्शाता है? / अर्थपूर्ण अधिगम / यांत्रिक अधिगम / निष्क्रिय अधिगम / आकस्मिक अधिगम / 3

कक्षा में सभी बच्चों को अपनी बात रखने का अवसर देना किस सिद्धांत से जुड़ा है? / सहभागिता / दंड / प्रतिस्पर्धा / बहिष्करण / 2

विद्यार्थी के व्यवहार को समझने के लिए सबसे उपयोगी तरीका कौन-सा है? / व्यवस्थित अवलोकन / केवल परीक्षा अंक / केवल उपस्थिति / केवल गृहकार्य / 4

किस प्रकार का वातावरण बच्चों में प्रश्न पूछने की प्रवृत्ति को बढ़ाता है? / भयमुक्त वातावरण / अत्यधिक दंड वाला वातावरण / केवल प्रतियोगी वातावरण / मौन वातावरण / 3

शिक्षक यदि किसी विद्यार्थी को उसके पिछले प्रदर्शन की तुलना में प्रगति के आधार पर प्रोत्साहित करता है, तो यह किसका उदाहरण है? / व्यक्तिगत प्रगति पर ध्यान / कठोर प्रतियोगिता / बाह्य नियंत्रण / नकारात्मक मूल्यांकन / 2

कक्षा में सीखने की कठिनाइयों की पहचान के बाद अगला उचित कदम क्या है? / उपयुक्त सुधारात्मक शिक्षण / विद्यार्थी को कक्षा से हटाना / केवल परीक्षा लेना / गृहकार्य बंद करना / 4

विद्यार्थियों को अपने उत्तरों पर पुनर्विचार करने का अवसर देने से क्या विकसित होता है? / आत्म-चिंतन / केवल स्मरण / केवल लिखावट / केवल गति / 3

बालक के भावनात्मक विकास में शिक्षक की सकारात्मक प्रतिक्रिया का क्या महत्व है? / सुरक्षा और आत्मविश्वास बढ़ सकता है / केवल अंक बढ़ते हैं / केवल अनुशासन बढ़ता है / सीखना रुक जाता है / 2

किस स्थिति में समूह चर्चा अधिक प्रभावी होगी? / जब विषय पर अलग-अलग विचार रखने का अवसर हो / जब केवल शिक्षक बोले / जब केवल एक विद्यार्थी उत्तर दे / जब प्रश्न न पूछा जाए / 4

बच्चों की उपलब्धियों की तुलना केवल दूसरे बच्चों से करना किस समस्या को जन्म दे सकता है? / अनावश्यक प्रतिस्पर्धा / बेहतर आत्म-नियमन / अधिक सहयोग / अधिक रचनात्मकता / 3

स्वतंत्र अधिगम में शिक्षक की भूमिका कैसी होती है? / मार्गदर्शक की / नियंत्रक की / केवल परीक्षक की / केवल व्याख्याता की / 4

बच्चों के अनुभवों को पाठ से जोड़ने का मुख्य लाभ क्या है? / नया ज्ञान अधिक अर्थपूर्ण बन सकता है / पाठ्यक्रम समाप्त हो जाता है / परीक्षा की आवश्यकता नहीं रहती / केवल गृहकार्य कम होता है / 3

एक विद्यार्थी किसी अवधारणा को चित्र बनाकर समझाता है। शिक्षक को इसे कैसे देखना चाहिए? / अभिव्यक्ति के वैकल्पिक माध्यम के रूप में / गलत उत्तर के रूप में / अनुशासनहीनता के रूप में / केवल कला गतिविधि के रूप में / 2

सीखने में असफलता को स्थायी मान लेना किस दृष्टिकोण से जुड़ा है? / स्थिर क्षमता की धारणा / विकासशील क्षमता / रचनावाद / सहयोगी अधिगम / 4

शिक्षक द्वारा कठिन अवधारणा के लिए ठोस उदाहरण देना किसमें सहायक है? / अवधारणा को अनुभव से जोड़ने में / केवल परीक्षा लेने में / केवल अनुशासन में / केवल स्मरण में / 3

विद्यार्थियों को अपनी सीखने की प्रगति स्वयं दर्ज करने देना किसका उदाहरण है? / आत्म-मूल्यांकन / केवल बाहरी मूल्यांकन / दंड / अनुकरण / 2

कक्षा में गलती करने पर हँसी उड़ाने से क्या प्रभाव पड़ सकता है? / विद्यार्थी उत्तर देने से झिझक सकता है / आत्मविश्वास बढ़ता है / रचनात्मकता बढ़ती है / सहभागिता बढ़ती है / 4

शिक्षक यदि एक ही अवधारणा को अलग-अलग उदाहरणों से समझाता है तो वह किसका ध्यान रख रहा है? / विविध अधिगम आवश्यकताओं का / केवल परीक्षा का / केवल पाठ्यपुस्तक का / केवल अनुशासन का / 3

अधिगम में जिज्ञासा को बढ़ाने के लिए शिक्षक को क्या करना चाहिए? / खोज और प्रश्न आधारित गतिविधियाँ देना / केवल उत्तर बताना / केवल नोट्स लिखवाना / केवल पाठ याद करवाना / 4

const recordPattern = /([\s\S]*?)\s*\/\s*([^/]*?)\s*\/\s*([^/]*?)\s*\/\s*([^/]*?)\s*\/\s*([^/]*?)\s*\/\s*([1-4])(?=\s|$)/g;
const quizData = [...quizDataText.trim().matchAll(recordPattern)].map((match, index) => {
  const fields = match.slice(1).map((field) => field.trim());
  if (fields.length !== 6) {
    throw new Error(`Question ${index + 1} must have 6 fields separated by /`);
  }
  const correctOption = Number(fields[5]);
  if (!Number.isInteger(correctOption) || correctOption < 1 || correctOption > 4) {
    throw new Error(`Question ${index + 1} correct option must be a number from 1 to 4`);
  }
  return { q: fields[0], o: fields.slice(1, 5), a: correctOption - 1 };
});

function formatQuestion(question) {
  return /[?؟]\s*$/.test(question) ? question : `${question}?`;
}

/* ================
   Sequential quiz flow
   ================ */
const quizEl = document.getElementById("quiz");
const startQuizBtn = document.getElementById("startQuizBtn");
const nextBtn = document.getElementById("nextBtn");
const submitBtn = document.getElementById("submitBtn");
const restartBtn = document.getElementById("restartBtn");
const scoreModal = document.getElementById("scoreModal");
const scoreTitle = document.getElementById("scoreTitle");
const scoreDesc = document.getElementById("scoreDesc");
const showAnswersBtn = document.getElementById("showAnswersBtn");
let currentQuestionIndex = 0;
let reviewMode = false;
let questionTimerId = null;
const totalTimeSeconds = 3600;
let timeLeft = totalTimeSeconds;
let timerStarted = false;
const userAnswers = new Array(quizData.length).fill(null);

function formatTime(totalSeconds) {
  const hours = Math.floor(totalSeconds / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;
  return [hours, minutes, seconds].map((value) => String(value).padStart(2, "0")).join(":");
}

function clearQuestionTimer() {
  if (questionTimerId) {
    clearInterval(questionTimerId);
    questionTimerId = null;
  }
}

function startQuestionTimer() {
  clearQuestionTimer();
  if (reviewMode) return;

  timerStarted = true;
  const timerBox = document.getElementById("questionTimer");
  if (timerBox) {
    timerBox.textContent = `Time: ${formatTime(timeLeft)}`;
  }

  questionTimerId = setInterval(() => {
    timeLeft -= 1;
    if (timerBox) {
      timerBox.textContent = `Time: ${formatTime(timeLeft)}`;
    }

    if (timeLeft <= 0) {
      clearQuestionTimer();
      submitQuiz();
    }
  }, 1000);
}

function updateControls() {
  const isLast = currentQuestionIndex === quizData.length - 1;

  nextBtn.style.display = reviewMode ? (isLast ? "none" : "inline-block") : "inline-block";
  submitBtn.style.display = "none";
  restartBtn.style.display = reviewMode ? "inline-block" : "none";

  nextBtn.textContent = isLast && !reviewMode ? "Submit" : "Next";
}

function showStartScreen() {
  clearQuestionTimer();
  timerStarted = false;
  timeLeft = totalTimeSeconds;
  reviewMode = false;
  currentQuestionIndex = 0;
  quizEl.innerHTML = "";
  startQuizBtn.style.display = "inline-flex";
}

function startQuiz() {
  timeLeft = totalTimeSeconds;
  timerStarted = true;
  reviewMode = false;
  currentQuestionIndex = 0;
  startQuizBtn.style.display = "none";
  renderQuestion();
}

function renderQuestion() {
  clearQuestionTimer();
  quizEl.innerHTML = "";

  const currentQuestion = quizData[currentQuestionIndex];
  const selectedAnswer = userAnswers[currentQuestionIndex];
  const questionAnswered = selectedAnswer !== null;

  const metaRow = document.createElement("div");
  metaRow.className = "question-meta";

  const startWrap = document.createElement("div");
  startWrap.className = "start-quiz-wrap";
  startWrap.appendChild(startQuizBtn);

  const quizTitle = document.createElement("h1");
  quizTitle.id = "quizTitle";
  quizTitle.textContent = "CTET 6-8";

  const counter = document.createElement("div");
  counter.id = "questionCounter";
  counter.className = "meta-box";
  counter.textContent = `Question ${currentQuestionIndex + 1}/${quizData.length}`;

  const timer = document.createElement("div");
  timer.id = "questionTimer";
  timer.className = "meta-box";
  timer.textContent = `Time: ${formatTime(timerStarted ? timeLeft : totalTimeSeconds)}`;

  metaRow.appendChild(counter);
  metaRow.appendChild(startWrap);
  metaRow.appendChild(quizTitle);
  metaRow.appendChild(timer);
  startQuizBtn.style.display = timerStarted || reviewMode ? "none" : "inline-flex";
  quizEl.appendChild(metaRow);

  const card = document.createElement("div");
  card.className = "question";

  const title = document.createElement("p");
  title.className = "q-title";
  title.textContent = `${String(currentQuestionIndex + 1).padStart(2, "0")}. ${formatQuestion(currentQuestion.q)}`;

  const opts = document.createElement("div");
  opts.className = "options";

  currentQuestion.o.forEach((opt, optionIndex) => {
    const id = `q${currentQuestionIndex}-o${optionIndex}`;
    const label = document.createElement("label");
    label.className = "option";
    label.setAttribute("for", id);

    const input = document.createElement("input");
    input.type = "radio";
    input.id = id;
    input.name = `q${currentQuestionIndex}`;
    input.value = optionIndex;
    input.checked = selectedAnswer === optionIndex;

    if (reviewMode || questionAnswered) {
      input.disabled = true;
      if (optionIndex === currentQuestion.a) {
        label.classList.add("correct");
      }
      if (selectedAnswer === optionIndex && selectedAnswer !== currentQuestion.a) {
        label.classList.add("incorrect");
      }
    } else {
      input.addEventListener("change", () => {
        userAnswers[currentQuestionIndex] = Number(input.value);
        if (!timerStarted) {
          timeLeft = totalTimeSeconds;
          timerStarted = true;
          startQuestionTimer();
        }
        renderQuestion();
      });
    }

    const span = document.createElement("span");
    span.className = "option-text";
    span.textContent = opt;

    label.appendChild(input);
    label.appendChild(span);
    opts.appendChild(label);
  });

  card.appendChild(title);
  card.appendChild(opts);

  if (reviewMode || questionAnswered) {
    const result = document.createElement("div");
    result.className = "result-message";
    result.style.display = "none";
    card.appendChild(result);
  }

  quizEl.appendChild(card);

  title.style.height = "auto";
  const lineHeight = parseFloat(getComputedStyle(title).lineHeight);
  if (title.scrollHeight > lineHeight * 3 + 1) {
    title.classList.add("dense");
  }
  title.style.height = "";

  updateControls();

  if (!reviewMode && timerStarted) {
    startQuestionTimer();
  }
}

function showAnswers() {
  clearQuestionTimer();
  timerStarted = false;
  reviewMode = true;
  currentQuestionIndex = 0;
  renderQuestion();
  scoreModal.style.display = "none";
}

function submitQuiz() {
  clearQuestionTimer();
  timerStarted = false;

  let score = 0;
  let attempted = 0;
  quizData.forEach((item, qi) => {
    if (userAnswers[qi] !== null) {
      attempted++;
      if (Number(userAnswers[qi]) === item.a) score++;
    }
  });

  scoreTitle.textContent = `आपका स्कोर: ${score}/${quizData.length}`;
  const incorrect = attempted - score;
  const notAttempted = quizData.length - attempted;
  scoreDesc.textContent = `सही उत्तर: ${score} • गलत उत्तर: ${incorrect} • Not Attempted: ${notAttempted}`;
  scoreModal.style.display = "flex";
}

nextBtn.addEventListener("click", () => {
  if (reviewMode) {
    if (currentQuestionIndex < quizData.length - 1) {
      currentQuestionIndex += 1;
      renderQuestion();
    }
  } else {
    if (!timerStarted) {
      timeLeft = totalTimeSeconds;
      timerStarted = true;
    }

    if (currentQuestionIndex < quizData.length - 1) {
      currentQuestionIndex += 1;
      renderQuestion();
    } else {
      submitQuiz();
    }
  }
  window.scrollTo({ top: 0, behavior: "smooth" });
});

submitBtn.addEventListener("click", submitQuiz);

startQuizBtn.addEventListener("click", startQuiz);
showAnswersBtn.addEventListener("click", restartQuiz);

function restartQuiz() {
  clearQuestionTimer();
  timerStarted = false;
  timeLeft = totalTimeSeconds;
  reviewMode = false;
  currentQuestionIndex = 0;
  userAnswers.fill(null);
  scoreModal.style.display = "none";
  renderQuestion();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

restartBtn.addEventListener("click", restartQuiz);

scoreModal.addEventListener("click", (e) => {
  if (e.target === scoreModal) scoreModal.style.display = "none";
});

renderQuestion();

</script>
