
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
  <title>करेंट अफेयर्स</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@400;600;700;800&display=swap');

    :root{
      --bg:#dfe9fb;
      --card:#ffffff;
      --text:#222;
      --muted:#6b7280;
      --accent:#2563eb;
      --ok:#16a34a;
      --bad:#dc2626;
      --border:#e5e7eb;
      --radius:14px;
      --space:14px;

      /* Base font sizes (mobile-first) */
      --fs-body:19px;
      --fs-label:19px;
      --fs-h1:27px;
      --fs-brand:31px; /* ~2pt (≈2.66px) बड़ा than h1 */
      --fs-btn:19px;
    }
    @media (min-width:480px){
      :root{
        --fs-body:19px;
        --fs-label:20px;
        --fs-h1:29px;
        --fs-brand:33px;
        --fs-btn:19px;
      }
    }
    @media (min-width:768px){
      :root{
        --fs-body:19px;
        --fs-label:21px;
        --fs-h1:31px;
        --fs-brand:35px;
        --fs-btn:19px;
      }
    }

    *{box-sizing:border-box}
    html {
      height: 100%;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    html::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;
    }
    body{
      margin:0;
      padding:8px 14px 24px;
      min-height:100vh;
      font-family:"Noto Serif Devanagari","Sanskrit Text","Noto Sans Devanagari","Nirmala UI",Mangal,serif;
      background:var(--bg);
      color:var(--text);
      line-height:1.5;
      font-size:var(--fs-body);
      box-sizing:border-box;
      overflow-x:hidden;
      overflow-y:auto;
      scrollbar-width:none;
      -ms-overflow-style:none;
      -webkit-text-size-adjust:100%;
      text-rendering:optimizeLegibility;
    }
    body::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;
    }
    .site-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      max-width:980px;
      margin:0 auto;
      position:relative;
    }
    .brand{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      font-weight:800;
      color:#ef4444; /* red */
      font-size:var(--fs-brand);
      letter-spacing:.2px;
    }
    .social-links{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:8px;
      margin-left:auto;
    }
    .social-link{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:38px;
      height:38px;
      border-radius:50%;
      color:#fff;
      text-decoration:none;
      transition:transform .15s ease, box-shadow .15s ease;
    }
    .social-link:hover{
      transform:translateY(-1px);
      box-shadow:0 5px 12px rgba(15,23,42,.2);
    }
    .social-link svg{
      width:21px;
      height:21px;
      fill:currentColor;
    }
    .youtube-link{ background:#ef4444; }
    .telegram-link{ background:#0ea5e9; }
    .whatsapp-link{ background:#22c55e; }
    .social-link:focus-visible{
      outline:3px solid rgba(37,99,235,.45);
      outline-offset:3px;
    }
    h1{
      text-align:center;
      font-size:var(--fs-h1);
      margin:12px 0 18px;
      color:#111827;
    }
    #quizTitle{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      margin:0;
      font-size:var(--fs-h1);
      line-height:1.2;
      white-space:nowrap;
    }

    .quiz-container{
      max-width:980px;
      margin:0 auto;
      display:grid;
      gap:6px;
    }
    .question{
      background:linear-gradient(135deg, #f8fbff 0%, #eef6ff 38%, #eaf1ff 100%);
      border:1px solid rgba(147, 197, 253, 0.65);
      border-radius:var(--radius);
      padding:16px;
      height:410px;
      overflow:hidden;
      box-shadow:0 6px 22px rgba(59, 130, 246, 0.12);
    }
    .question-meta{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin:0 0 10px;
      position:relative;
    }
    .meta-box{
      display:inline-flex;
      align-items:center;
      min-height:42px;
      padding:8px 14px;
      border-radius:10px;
      background:rgba(255,255,255,0.18);
      border:1px solid rgba(59, 130, 246, 0.25);
      color:#1f2937;
      font-weight:800;
      font-size:1.05rem;
      box-shadow:0 2px 10px rgba(59, 130, 246, 0.1);
      text-align:left;
      line-height:1.4;
    }
    #questionCounter{
      justify-content:flex-start;
      min-width:150px;
    }
    #questionTimer{
      justify-content:flex-end;
      min-width:120px;
      margin-left:auto;
    }
    .q-title{
      font-weight:800;
      font-size:1.25rem;
      line-height:1.7;
      white-space:pre-line;
      height:auto;
      overflow:hidden;
      margin:0 0 4px;
      color:#0f172a;
      text-shadow:none;
    }
    .q-title.compact{
      font-size:1.1rem;
      line-height:1.55;
    }
    .q-title.dense{
      font-size:1rem;
      line-height:1.45;
    }
    .options{
      display:flex;
      flex-direction:column;
      gap:10px; /* vertical spacing line by line */
    }

    /* Each option as a separate box */
    .options label.option{
      display:flex;
      align-items:center;
      gap:12px;
      padding:12px 14px;
      border:2px solid rgba(96, 165, 250, 0.5);
      border-radius:12px;
      background:linear-gradient(135deg, #ffffff 0%, #edf6ff 100%);
      cursor:pointer;
      transition:all .15s ease;
      font-size:var(--fs-label);
      user-select:none;
      color:#0f172a;
    }
    .options label.option:hover{
      border-color:#60a5fa;
      background:linear-gradient(135deg, #f8fbff 0%, #e0ecff 100%);
    }
    .option-text{
      flex:1;
      line-height:1.5;
      color:#0f172a;
      font-weight:700;
      text-shadow:none;
    }

    /* Bigger radio for mobile */
    .options input[type="radio"]{
      appearance:none;
      width:26px;
      height:26px;
      min-width:26px;
      min-height:26px;
      border:2px solid #9ca3af;
      border-radius:50%;
      display:inline-block;
      position:relative;
      outline:none;
      transition:border-color .15s ease, box-shadow .15s ease;
      background:#fff;
    }
    .options input[type="radio"]:checked{
      border-color:#60a5fa;
      box-shadow:0 0 0 3px rgba(96,165,250,0.12);
    }
    .options input[type="radio"]::after{
      content:"";
      position:absolute;
      inset:5px;
      border-radius:50%;
      background:transparent;
      transition:background .15s ease;
    }
    .options input[type="radio"]:checked::after{
      background:#60a5fa;
    }
    .options input[type="radio"]:checked ~ .option-text,
    .options label.option:has(input:checked) .option-text{
      color:#0f172a;
      text-shadow:none;
    }
    .options label.option:has(input:checked){
      background:linear-gradient(135deg, #ffffff 0%, #edf6ff 100%);
      border-color:#60a5fa;
      box-shadow:none;
    }

    /* Correct/Incorrect colors */
    .option.correct{
      background:#dcfce7 !important;
      border-color:var(--ok) !important;
    }
    .option.incorrect{
      background:#fee2e2 !important;
      border-color:var(--bad) !important;
    }
    .result-message{
      margin-top:12px;
      padding:10px 12px;
      border-radius:10px;
      background:rgba(255,255,255,0.8);
      border:1px solid rgba(148, 163, 184, 0.4);
      font-weight:800;
      line-height:1.5;
    }

    /* Buttons row (submit + restart) */
    .actions{
      position:sticky;
      bottom:0;
      left:0; right:0;
      background:rgba(247,247,251,.85);
      backdrop-filter: blur(6px);
      border-top:1px solid var(--border);
      padding:12px 10px;
      display:flex;
      gap:10px;
      justify-content:center;
      z-index:5;
    }
    .btn{
      border:0;
      border-radius:999px;
      padding:12px 18px;
      font-weight:700;
      font-size:var(--fs-btn);
      cursor:pointer;
      box-shadow:0 4px 14px rgba(0,0,0,.08);
      transition:transform .15s ease, box-shadow .15s ease;
    }
    .start-quiz-wrap{
      display:flex;
      justify-content:flex-start;
      align-items:center;
      margin:0;
    }
    .start-quiz-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:38px;
      min-width:116px;
      padding:8px 11px;
      border-radius:10px;
      background:linear-gradient(135deg, #2563eb, #7c3aed);
      color:#fff;
      font-size:.8rem;
      font-weight:800;
      line-height:1.2;
      box-shadow:0 8px 18px rgba(37, 99, 235, 0.2);
      margin-left:0;
    }
    .start-quiz-btn:disabled{
      opacity:0.75;
      cursor:not-allowed;
    }
    .btn:hover{
      transform:translateY(-1px);
      box-shadow:0 8px 18px rgba(0,0,0,.12);
    }
    .btn-submit{ background:#22c55e; color:#fff; }
    .btn-final-submit{ background:#7c3aed; color:#fff; }
    .btn-restart{ background:#ef4444; color:#fff; }
    #prevBtn,
    #nextBtn{
      min-width:150px;
      font-size:20px;
      padding:14px 22px;
      background:linear-gradient(135deg, #2563eb, #7c3aed);
      color:#fff;
      box-shadow:none;
      border:0;
      outline:none;
    }

    #prevBtn:hover,
    #nextBtn:hover{
      box-shadow:none;
    }

    /* Score modal */
    .modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.4);
      display:none;
      align-items:center;
      justify-content:center;
      padding:20px;
      z-index:50;
    }
    .modal .card{
      background:#fff;
      border-radius:18px;
      padding:24px;
      width:min(520px, 96vw);
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,.2);
    }
    .score{
      font-size:28px;
      font-weight:800;
      margin:8px 0 2px;
      color:#111827;
    }
    .note{
      font-size:16px;
      color:var(--muted);
      margin-bottom:14px;
    }
    .modal .btn{
      width:100%;
    }
    .sr-only{
      position:absolute!important;
      height:1px;width:1px;
      overflow:hidden;clip:rect(1px,1px,1px,1px);
      white-space:nowrap;border:0;padding:0;margin:-1px;
    }

    @media (max-width: 480px){
      body{
        padding:8px 10px 18px;
      }
      .site-header{
        gap:10px;
      }
      .brand{
        font-size:24px;
        line-height:1.3;
      }
      .social-links{
        gap:6px;
      }
      .social-link{
        width:34px;
        height:34px;
      }
      .social-link svg{
        width:18px;
        height:18px;
      }
      h1{
        font-size:24px;
        margin-bottom:12px;
      }
      .quiz-container{
        gap:4px;
      }
      .question{
        padding:12px;
        height:360px;
      }
      .question-meta{
        gap:8px;
        align-items:center;
        flex-wrap:wrap;
      }
      .meta-box{
        min-height:36px;
        padding:7px 10px;
        font-size:0.9rem;
      }
      #questionCounter{
        min-width:0;
      }
      #questionTimer{
        min-width:90px;
      }
      .start-quiz-btn{
        min-height:34px;
        min-width:104px;
        padding:7px 9px;
        font-size:.76rem;
      }
      .q-title{
        font-size:1.08rem;
        line-height:1.6;
        height:auto;
        margin-bottom:4px;
        word-break:break-word;
      }
      .q-title.dense{
        font-size:.92rem;
        line-height:1.4;
      }
      .options{
        gap:8px;
      }
      .options label.option{
        align-items:flex-start;
        gap:10px;
        padding:10px 12px;
      }
      .option-text{
        font-size:0.95rem;
        line-height:1.5;
        word-break:break-word;
      }
      .actions{
        padding:10px 8px 12px;
        gap:8px;
      }
      .btn{
        padding:11px 14px;
        font-size:15px;
      }
      #prevBtn,
      #nextBtn{
        min-width:110px;
        padding:12px 14px;
        font-size:15px;
      }
      .modal .card{
        padding:18px 16px;
      }
      .score{
        font-size:24px;
      }
      .note{
        font-size:14px;
      }
    }
  </style>
</head>
<body>

<script>
/* =========================
   Q&A DATA
  Format: Question / Option 1 / Option 2 / Option 3 / Option 4 / Correct option number
  Questions may be separated by a line break or a blank line. Line breaks inside a question are preserved.
   Example: भारत की राजधानी क्या है? / मुंबई / दिल्ली / पटना / जयपुर / 2
   ========================= */
const quizDataText = `
**बाल विकास एवं शिक्षाशास्त्र — 30 प्रश्न**

बच्चे के व्यक्तित्व विकास में सामाजिक वातावरण की क्या भूमिका होती है? / यह केवल शारीरिक वृद्धि करता है / यह सामाजिक व्यवहार और दृष्टिकोण को प्रभावित करता है / इसका कोई प्रभाव नहीं होता / यह केवल भाषा को प्रभावित करता है / 2

अधिगम की प्रक्रिया में प्रेरणा का क्या महत्व है? / यह केवल परीक्षा में उपयोगी है / यह केवल शिक्षक के लिए जरूरी है / यह विद्यार्थी को प्रयास करने और लक्ष्य की ओर बढ़ने में सहायता करती है / यह केवल गृहकार्य पूरा करवाती है / 3

किस स्थिति में शिक्षक को 'प्रतीक्षा समय' का प्रयोग करना चाहिए? / प्रश्न पूछने के तुरंत बाद स्वयं उत्तर देने में / केवल तेज बच्चों से उत्तर लेने में / केवल कठिन प्रश्नों को हटाने में / विद्यार्थियों को सोचकर उत्तर देने का अवसर देने में / 4

विद्यार्थियों की उपलब्धि का आकलन करते समय सबसे उपयोगी दृष्टिकोण क्या है? / केवल अंतिम परीक्षा पर निर्भर रहना / केवल मौखिक उत्तर देखना / विभिन्न प्रमाणों और गतिविधियों को देखना / केवल गृहकार्य देखना / 3

बच्चे द्वारा किसी समस्या का अपना तरीका विकसित करना किस बात का संकेत है? / केवल अनुकरण / सक्रिय चिंतन / केवल स्मरण / केवल अनुशासन / 2

कक्षा में 'सहयोगी अधिगम' का वातावरण बनाने के लिए क्या आवश्यक है? / विद्यार्थियों को एक-दूसरे की सहायता और विचार-विनिमय का अवसर देना / केवल व्यक्तिगत परीक्षा लेना / केवल शिक्षक को बोलने देना / केवल प्रतियोगिता करवाना / 1

यदि विद्यार्थी किसी प्रश्न का गलत उत्तर देता है तो शिक्षक को क्या करना चाहिए? / उसे तुरंत चुप करा देना / गलती के कारण और उसकी सोच को समझना / केवल सही उत्तर लिखवा देना / उसे दंड देना / 2

किस प्रकार का अधिगम वास्तविक जीवन की समस्याओं से अधिक जुड़ा होता है? / समस्या-आधारित अधिगम / यांत्रिक रटंत / केवल व्याख्यान / केवल अनुकरण / 1

शिक्षक द्वारा विद्यार्थियों को विकल्प देकर कार्य चुनने देना किसे बढ़ावा देता है? / निर्भरता / स्वायत्तता / निष्क्रियता / भय / 2

बच्चों के सीखने में पूर्व अनुभवों की भूमिका क्या है? / वे नई अवधारणाओं को समझने का आधार बन सकते हैं / वे सीखने में हमेशा बाधा हैं / उनका कोई महत्व नहीं / वे केवल परीक्षा में उपयोगी हैं / 4

कक्षा में विविधता को संसाधन मानने का क्या अर्थ है? / अलग-अलग अनुभवों से सीखने के अवसर बनाना / बच्चों को अलग-अलग पढ़ाना / केवल एक भाषा का उपयोग करना / केवल एक प्रकार की गतिविधि करना / 4

किस परिस्थिति में विद्यार्थी अधिक सक्रिय रूप से सीख सकता है? / जब उसे प्रश्न पूछने और खोजने का अवसर मिले / जब उसे केवल नोट्स लिखने हों / जब उसे केवल उत्तर याद करने हों / जब शिक्षक लगातार बोलता रहे / 3

स्व-नियमन में विद्यार्थी का कौन-सा व्यवहार दिखाई देता है? / अपने लक्ष्य और प्रगति पर नजर रखना / केवल शिक्षक का इंतजार करना / केवल दूसरों की नकल करना / केवल परीक्षा देना / 2

बच्चों में आत्म-प्रभावकारिता बढ़ाने के लिए शिक्षक क्या कर सकता है? / प्राप्त करने योग्य चुनौतियाँ और सकारात्मक प्रतिक्रिया देना / हर गलती पर दंड देना / केवल कठिन कार्य देना / तुलना करना / 4

किस प्रकार का प्रश्न उच्च स्तरीय चिंतन को अधिक बढ़ावा देता है? / इसका कारण क्या हो सकता है? / इसका नाम क्या है? / इसकी संख्या क्या है? / यह कब हुआ? / 1

कक्षा में सीखने के लिए 'सहपाठी सहयोग' क्यों उपयोगी है? / विद्यार्थी एक-दूसरे की रणनीतियाँ और विचार समझ सकते हैं / शिक्षक की आवश्यकता समाप्त हो जाती है / केवल प्रतियोगिता होती है / केवल समय बचता है / 2

यदि किसी विद्यार्थी की लिखित अभिव्यक्ति कमजोर है, तो शिक्षक को क्या करना चाहिए? / अतिरिक्त अभ्यास और वैकल्पिक अभिव्यक्ति के अवसर देना / उसे कम अंक देकर छोड़ देना / केवल पाठ रटाना / उसे गतिविधियों से हटाना / 4

बाल-केंद्रित कक्षा में पाठ की गति किसके अनुसार समायोजित की जा सकती है? / विद्यार्थियों की समझ और आवश्यकताओं के अनुसार / केवल घड़ी के अनुसार / केवल पाठ्यपुस्तक के अनुसार / केवल शिक्षक की सुविधा के अनुसार / 3

अधिगम में जिज्ञासा का क्या योगदान है? / यह खोज और प्रश्न करने की प्रवृत्ति को बढ़ा सकती है / यह केवल परीक्षा में उपयोगी है / यह सीखने में बाधा है / इसका कोई योगदान नहीं / 2

कक्षा में विद्यार्थियों के प्रश्नों को प्रोत्साहित करने का एक लाभ क्या है? / सोचने और समझने की प्रक्रिया सक्रिय होती है / केवल शोर बढ़ता है / केवल समय नष्ट होता है / केवल परीक्षा आसान होती है / 4

किस प्रकार का मूल्यांकन सीखने के दौरान शिक्षक को शिक्षण में सुधार करने में सहायता करता है? / निर्माणात्मक मूल्यांकन / केवल अंतिम परीक्षा / केवल प्रवेश परीक्षा / केवल वार्षिक परीक्षा / 3

विद्यार्थियों को स्वयं अपने कार्य के मानदंड तय करने देना किस क्षमता को बढ़ा सकता है? / आत्म-मूल्यांकन और स्वायत्तता / केवल स्मरण / केवल अनुकरण / केवल लेखन गति / 2

किस प्रकार की कक्षा में सीखने की संभावना अधिक होती है? / जहाँ गलती को सीखने का अवसर माना जाता है / जहाँ गलती पर दंड मिलता है / जहाँ प्रश्न पूछना मना हो / जहाँ केवल अंक महत्वपूर्ण हों / 4

शिक्षक यदि किसी बच्चे की उपलब्धि को उसकी पिछली उपलब्धि से तुलना करता है तो वह किस पर ध्यान देता है? / व्यक्तिगत प्रगति / प्रतियोगिता / समूह रैंक / केवल अंतिम अंक / 3

किस गतिविधि से समस्या-समाधान क्षमता का विकास हो सकता है? / वास्तविक परिस्थिति से जुड़ी समस्या का समाधान करना / केवल उत्तर याद करना / केवल परिभाषा लिखना / केवल पाठ पढ़ना / 2

बच्चों को सीखने की रणनीतियों पर चर्चा करवाने से क्या विकसित हो सकता है? / अधिगम के प्रति जागरूकता / केवल स्मरण / केवल अनुकरण / केवल लिखावट / 4

शिक्षक को प्रतिभाशाली विद्यार्थियों के लिए क्या करना चाहिए? / उन्हें चुनौतीपूर्ण और गहन कार्य देना / उन्हें हमेशा खाली रखना / केवल आसान प्रश्न देना / उन्हें दूसरों से अलग करना / 3

कक्षा में सहयोगी व्यवहार को बढ़ाने के लिए कौन-सी गतिविधि उपयोगी है? / साझा लक्ष्य वाला समूह कार्य / केवल व्यक्तिगत प्रतियोगिता / केवल मौखिक परीक्षा / केवल गृहकार्य / 2

विद्यार्थियों की रुचि जानने का उपयुक्त तरीका क्या है? / बातचीत, अवलोकन और गतिविधियों के माध्यम से जानकारी लेना / केवल अंक देखना / केवल उपस्थिति देखना / केवल परीक्षा परिणाम देखना / 4

const recordPattern = /([\s\S]*?)\s*\/\s*([^/]*?)\s*\/\s*([^/]*?)\s*\/\s*([^/]*?)\s*\/\s*([^/]*?)\s*\/\s*([1-4])(?=\s|$)/g;
const quizData = [...quizDataText.trim().matchAll(recordPattern)].map((match, index) => {
  const fields = match.slice(1).map((field) => field.trim());
  if (fields.length !== 6) {
    throw new Error(`Question ${index + 1} must have 6 fields separated by /`);
  }
  const correctOption = Number(fields[5]);
  if (!Number.isInteger(correctOption) || correctOption < 1 || correctOption > 4) {
    throw new Error(`Question ${index + 1} correct option must be a number from 1 to 4`);
  }
  return { q: fields[0], o: fields.slice(1, 5), a: correctOption - 1 };
});

function formatQuestion(question) {
  return /[?؟]\s*$/.test(question) ? question : `${question}?`;
}

/* ================
   Sequential quiz flow
   ================ */
const quizEl = document.getElementById("quiz");
const startQuizBtn = document.getElementById("startQuizBtn");
const nextBtn = document.getElementById("nextBtn");
const submitBtn = document.getElementById("submitBtn");
const restartBtn = document.getElementById("restartBtn");
const scoreModal = document.getElementById("scoreModal");
const scoreTitle = document.getElementById("scoreTitle");
const scoreDesc = document.getElementById("scoreDesc");
const showAnswersBtn = document.getElementById("showAnswersBtn");
let currentQuestionIndex = 0;
let reviewMode = false;
let questionTimerId = null;
const totalTimeSeconds = 3600;
let timeLeft = totalTimeSeconds;
let timerStarted = false;
const userAnswers = new Array(quizData.length).fill(null);

function formatTime(totalSeconds) {
  const hours = Math.floor(totalSeconds / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;
  return [hours, minutes, seconds].map((value) => String(value).padStart(2, "0")).join(":");
}

function clearQuestionTimer() {
  if (questionTimerId) {
    clearInterval(questionTimerId);
    questionTimerId = null;
  }
}

function startQuestionTimer() {
  clearQuestionTimer();
  if (reviewMode) return;

  timerStarted = true;
  const timerBox = document.getElementById("questionTimer");
  if (timerBox) {
    timerBox.textContent = `Time: ${formatTime(timeLeft)}`;
  }

  questionTimerId = setInterval(() => {
    timeLeft -= 1;
    if (timerBox) {
      timerBox.textContent = `Time: ${formatTime(timeLeft)}`;
    }

    if (timeLeft <= 0) {
      clearQuestionTimer();
      submitQuiz();
    }
  }, 1000);
}

function updateControls() {
  const isLast = currentQuestionIndex === quizData.length - 1;

  nextBtn.style.display = reviewMode ? (isLast ? "none" : "inline-block") : "inline-block";
  submitBtn.style.display = "none";
  restartBtn.style.display = reviewMode ? "inline-block" : "none";

  nextBtn.textContent = isLast && !reviewMode ? "Submit" : "Next";
}

function showStartScreen() {
  clearQuestionTimer();
  timerStarted = false;
  timeLeft = totalTimeSeconds;
  reviewMode = false;
  currentQuestionIndex = 0;
  quizEl.innerHTML = "";
  startQuizBtn.style.display = "inline-flex";
}

function startQuiz() {
  timeLeft = totalTimeSeconds;
  timerStarted = true;
  reviewMode = false;
  currentQuestionIndex = 0;
  startQuizBtn.style.display = "none";
  renderQuestion();
}

function renderQuestion() {
  clearQuestionTimer();
  quizEl.innerHTML = "";

  const currentQuestion = quizData[currentQuestionIndex];
  const selectedAnswer = userAnswers[currentQuestionIndex];
  const questionAnswered = selectedAnswer !== null;

  const metaRow = document.createElement("div");
  metaRow.className = "question-meta";

  const startWrap = document.createElement("div");
  startWrap.className = "start-quiz-wrap";
  startWrap.appendChild(startQuizBtn);

  const quizTitle = document.createElement("h1");
  quizTitle.id = "quizTitle";
  quizTitle.textContent = "CTET 6-8";

  const counter = document.createElement("div");
  counter.id = "questionCounter";
  counter.className = "meta-box";
  counter.textContent = `Question ${currentQuestionIndex + 1}/${quizData.length}`;

  const timer = document.createElement("div");
  timer.id = "questionTimer";
  timer.className = "meta-box";
  timer.textContent = `Time: ${formatTime(timerStarted ? timeLeft : totalTimeSeconds)}`;

  metaRow.appendChild(counter);
  metaRow.appendChild(startWrap);
  metaRow.appendChild(quizTitle);
  metaRow.appendChild(timer);
  startQuizBtn.style.display = timerStarted || reviewMode ? "none" : "inline-flex";
  quizEl.appendChild(metaRow);

  const card = document.createElement("div");
  card.className = "question";

  const title = document.createElement("p");
  title.className = "q-title";
  title.textContent = `${String(currentQuestionIndex + 1).padStart(2, "0")}. ${formatQuestion(currentQuestion.q)}`;

  const opts = document.createElement("div");
  opts.className = "options";

  currentQuestion.o.forEach((opt, optionIndex) => {
    const id = `q${currentQuestionIndex}-o${optionIndex}`;
    const label = document.createElement("label");
    label.className = "option";
    label.setAttribute("for", id);

    const input = document.createElement("input");
    input.type = "radio";
    input.id = id;
    input.name = `q${currentQuestionIndex}`;
    input.value = optionIndex;
    input.checked = selectedAnswer === optionIndex;

    if (reviewMode || questionAnswered) {
      input.disabled = true;
      if (optionIndex === currentQuestion.a) {
        label.classList.add("correct");
      }
      if (selectedAnswer === optionIndex && selectedAnswer !== currentQuestion.a) {
        label.classList.add("incorrect");
      }
    } else {
      input.addEventListener("change", () => {
        userAnswers[currentQuestionIndex] = Number(input.value);
        if (!timerStarted) {
          timeLeft = totalTimeSeconds;
          timerStarted = true;
          startQuestionTimer();
        }
        renderQuestion();
      });
    }

    const span = document.createElement("span");
    span.className = "option-text";
    span.textContent = opt;

    label.appendChild(input);
    label.appendChild(span);
    opts.appendChild(label);
  });

  card.appendChild(title);
  card.appendChild(opts);

  if (reviewMode || questionAnswered) {
    const result = document.createElement("div");
    result.className = "result-message";
    result.style.display = "none";
    card.appendChild(result);
  }

  quizEl.appendChild(card);

  title.style.height = "auto";
  const lineHeight = parseFloat(getComputedStyle(title).lineHeight);
  if (title.scrollHeight > lineHeight * 3 + 1) {
    title.classList.add("dense");
  }
  title.style.height = "";

  updateControls();

  if (!reviewMode && timerStarted) {
    startQuestionTimer();
  }
}

function showAnswers() {
  clearQuestionTimer();
  timerStarted = false;
  reviewMode = true;
  currentQuestionIndex = 0;
  renderQuestion();
  scoreModal.style.display = "none";
}

function submitQuiz() {
  clearQuestionTimer();
  timerStarted = false;

  let score = 0;
  let attempted = 0;
  quizData.forEach((item, qi) => {
    if (userAnswers[qi] !== null) {
      attempted++;
      if (Number(userAnswers[qi]) === item.a) score++;
    }
  });

  scoreTitle.textContent = `आपका स्कोर: ${score}/${quizData.length}`;
  const incorrect = attempted - score;
  const notAttempted = quizData.length - attempted;
  scoreDesc.textContent = `सही उत्तर: ${score} • गलत उत्तर: ${incorrect} • Not Attempted: ${notAttempted}`;
  scoreModal.style.display = "flex";
}

nextBtn.addEventListener("click", () => {
  if (reviewMode) {
    if (currentQuestionIndex < quizData.length - 1) {
      currentQuestionIndex += 1;
      renderQuestion();
    }
  } else {
    if (!timerStarted) {
      timeLeft = totalTimeSeconds;
      timerStarted = true;
    }

    if (currentQuestionIndex < quizData.length - 1) {
      currentQuestionIndex += 1;
      renderQuestion();
    } else {
      submitQuiz();
    }
  }
  window.scrollTo({ top: 0, behavior: "smooth" });
});

submitBtn.addEventListener("click", submitQuiz);

startQuizBtn.addEventListener("click", startQuiz);
showAnswersBtn.addEventListener("click", restartQuiz);

function restartQuiz() {
  clearQuestionTimer();
  timerStarted = false;
  timeLeft = totalTimeSeconds;
  reviewMode = false;
  currentQuestionIndex = 0;
  userAnswers.fill(null);
  scoreModal.style.display = "none";
  renderQuestion();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

restartBtn.addEventListener("click", restartQuiz);

scoreModal.addEventListener("click", (e) => {
  if (e.target === scoreModal) scoreModal.style.display = "none";
});

renderQuestion();

</script>
